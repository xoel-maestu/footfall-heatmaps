[project]
name = "space-usage-heatmaps"
version = "0.1.0"
description = "Anonymous foot-traffic heatmaps on the floor plan from fixed cameras"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pot>=0.9.5",
    "pyyaml>=6.0",
    # perception: video decoding (OpenCvFileSource), ByteTrack and OC-SORT
    # (ByteTrackTracker, OcSortTracker), and the floor-plane tracker's
    # assignment (UcmcTracker; scipy was already pulled by pot and trackers)
    "opencv-python-headless>=4.10",
    "trackers==2.6.1",
    "scipy>=1.14",
]

[project.scripts]
space-usage = "space_usage_heatmaps.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Iteration 0 (the baseline) only: the Ultralytics reference recipe, measured.
# ultralytics is AGPL-3.0: evaluation-only, imported only under
# space_usage_heatmaps/evaluation/baseline and never by the pipeline. Not a default
# group, so CI (scripts/verify.sh: uv sync --locked) never installs it.
# Install locally with: uv sync --group baseline
baseline = [
    "ultralytics>=8.4",
    "torch>=2.14",
    "torchvision>=0.29",
    "nvidia-ml-py>=13.0",
    "lap>=0.5.12",
]

# Model runtime of the perception pipeline (ONNX Runtime on CUDA, with the
# CUDA 13 and cuDNN 9 libraries as wheels; NVML for the bench's VRAM). Heavy
# and GPU-only, so not a default group: CI's tests use a fake detector.
# Install locally with: uv sync --group runtime
runtime = [
    "onnxruntime-gpu[cuda,cudnn]>=1.31",
    "nvidia-ml-py>=13.0",
    # D-FINE's letterbox resizes with Pillow's bilinear filter (its official
    # ONNX example); OpenCV's differs when downscaling.
    "pillow>=11",
]

# TensorRT 10 libraries for engine onnx-trt (ONNX Runtime's TensorRT execution
# provider, fp16). NVIDIA proprietary licence (docs/licenses.md): optional, never
# needed by the default path, which falls back to CUDA without it. From NVIDIA's
# own index; ONNX Runtime 1.31's provider links against libnvinfer.so.10.
# Install locally with: uv sync --group runtime --group tensorrt
tensorrt = [
    "tensorrt-cu13-libs>=10.16,<11",
]

# Detector export only (scripts/export-detector.py): each family's official
# exporter turns its release checkpoint into the ONNX file the runtime group
# runs. Never imported by the package; CPU is enough. Not a default group.
# Install locally with: uv sync --group runtime --group export
export = [
    "torch>=2.14",
    "torchvision>=0.29",
    "onnx>=1.19",
    "onnxsim>=0.4.36",
    "loguru>=0.7",
    "thop>=0.1.1.post2209072238",
    "tabulate>=0.9",
    "faster-coco-eval>=1.6.6",
    "tensorboard>=2.18",
]

[tool.uv]
# trackers (and ultralytics) require opencv-python, the GUI build; it ships the
# same cv2 module as opencv-python-headless and the two overwrite each other.
# Only the headless build is installed: nothing here opens a window.
# av (PyAV), required by supervision, is excluded too: its wheels bundle an
# LGPL-3.0+ FFmpeg linked with GPL-2.0+ libx264 and libx265, and supervision
# imports it only inside its video helpers, which nothing here calls
# (tests/perception/infrastructure/test_dependencies.py).
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "av; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "baseline" },
    { index = "pytorch-cu130", group = "export" },
]
torchvision = [
    { index = "pytorch-cu130", group = "baseline" },
    { index = "pytorch-cu130", group = "export" },
]
tensorrt-cu13-libs = { index = "nvidia", group = "tensorrt" }

# CUDA 13.0 wheels: bundle the CUDA runtime (no nvcc needed), support Turing
# (sm_75, GTX 1650 Ti) and run on driver 615.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# NVIDIA's index: the TensorRT wheels (PyPI has only a stub that downloads them).
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_usage_heatmaps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# POT ships a docstring with an invalid escape; not ours to fix.
filterwarnings = ["ignore:invalid escape sequence:SyntaxWarning"]

# The generated contracts of scripts/check-layers.sh (--print-config py), with
# two exceptions (docs/architecture.md, rule 3): numpy and ot
# (POT) are pure numerical libraries without I/O, and the grid, homography and
# metrics are array maths. Every other installed distribution stays forbidden,
# plus the planned I/O and model packages before they are installed.
[tool.importlinter]
root_packages = ["space_usage_heatmaps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports only domain"
type = "forbidden"
source_modules = [
    "space_usage_heatmaps.evaluation.domain",
    "space_usage_heatmaps.floorplan.domain",
    "space_usage_heatmaps.occupancy.domain",
    "space_usage_heatmaps.perception.domain",
]
forbidden_modules = [
    "space_usage_heatmaps.evaluation.application",
    "space_usage_heatmaps.evaluation.infrastructure",
    "space_usage_heatmaps.occupancy.application",
    "space_usage_heatmaps.occupancy.infrastructure",
    "space_usage_heatmaps.perception.application",
    "space_usage_heatmaps.perception.infrastructure",
    "space_usage_heatmaps.cli",
    "space_usage_heatmaps.web",
]

[[tool.importlinter.contracts]]
name = "application imports only domain and application"
type = "forbidden"
source_modules = [
    "space_usage_heatmaps.evaluation.application",
    "space_usage_heatmaps.occupancy.application",
    "space_usage_heatmaps.perception.application",
]
forbidden_modules = [
    "space_usage_heatmaps.evaluation.infrastructure",
    "space_usage_heatmaps.occupancy.infrastructure",
    "space_usage_heatmaps.perception.infrastructure",
    "space_usage_heatmaps.cli",
    "space_usage_heatmaps.web",
]

[[tool.importlinter.contracts]]
name = "domain and application import no third-party package but numpy and ot"
type = "forbidden"
source_modules = [
    "space_usage_heatmaps.evaluation.domain",
    "space_usage_heatmaps.floorplan.domain",
    "space_usage_heatmaps.occupancy.domain",
    "space_usage_heatmaps.perception.domain",
    "space_usage_heatmaps.evaluation.application",
    "space_usage_heatmaps.occupancy.application",
    "space_usage_heatmaps.perception.application",
]
forbidden_modules = [
    "click", "grimp", "importlinter", "iniconfig", "markdown_it", "mdurl",
    "packaging", "pluggy", "py", "pygments", "pytest", "rich", "ruff", "scipy",
    "typing_extensions",
    "cv2", "yaml", "onnxruntime", "torch", "ultralytics", "tensorrt",
    # The optional baseline group (uv sync --group baseline) and its dependencies.
    "PIL", "anyio", "certifi", "charset_normalizer", "contourpy", "cuda", "cycler",
    "dateutil", "example", "filelock", "fontTools", "fsspec", "functorch", "h11",
    "httpcore", "httpx", "idna", "isympy", "jinja2", "kiwisolver", "lap", "markupsafe",
    "matplotlib", "mpl_toolkits", "mpmath", "networkx", "nvidia", "polars", "psutil",
    "pylab", "pynvml", "pyparsing", "requests", "setuptools", "sympy", "thop",
    "torchgen", "torchvision", "triton", "tzdata", "ultralytics_platform", "urllib3",
    # perception: the default dependencies opencv-python-headless and trackers.
    "av", "defusedxml", "deprecate", "supervision", "tqdm", "trackers",
    # The optional runtime group (uv sync --group runtime).
    "flatbuffers", "google",
    # The optional tensorrt group (uv sync --group tensorrt).
    "tensorrt_libs",
    # The optional export group (uv sync --group export).
    "absl", "faster_coco_eval", "grpc", "loguru", "markdown", "ml_dtypes", "onnx", "onnxsim",
    "tabulate", "tensorboard", "tensorboard_data_server", "werkzeug",
]
