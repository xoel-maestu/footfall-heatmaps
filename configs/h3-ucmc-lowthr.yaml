# H3b-2 (hypothesis 3): configs/h3-ucmc.yaml with the box thresholds of
# configs/h1-best.yaml's ByteTrack, so the comparison tests floor association
# and not thresholds. Same detections (the detection cache replays them).
#
# conf_thresh 0.1: boxes down to the detector's own score cut (YOLOX score_thr
# 0.1) continue tracks, as ByteTrack's second stage does; high_score 0.6 is
# ByteTrack's high_conf_det_threshold (and UCMCTrack's default).
# wx, wy, a: UCMCTrack's per-sequence values for a fixed camera filming
# pedestrians (run_mot17_test.bat, MOT17-01: wx 0.20, wy 0.40, a 10, cdt 30,
# vmax 0.5; its MOT20 fixed cameras use wx 0.2-0.5, wy 0.3-0.4, a 9-12).
detector: yolox-s      # Megvii YOLOX-s 0.1.1rc0 checkpoint, exported by scripts/export-detector.py yolox-s-960
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: ucmc          # perception/infrastructure/ucmc_tracker.py
tracker_params:
  conf_thresh: 0.1
  high_score: 0.6
  wx: 0.2
  wy: 0.4
  a1: 10.0
  a2: 10.0
input_size: 960        # the exported model's fixed input
foot_point: auto-track # as h1-best.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
