# H3a-2 (hypothesis 3): configs/h3-ocsort.yaml with its detection
# threshold lowered to the lowest box configs/h1-best.yaml's ByteTrack uses
# (the detector's score_thr 0.1), so the comparison tests association and not
# thresholds. OC-SORT has no low-score stage: boxes from 0.1 also start
# tracks, which still need 3 consecutive matches to be reported. Same
# detections (the detection cache replays them).
detector: yolox-s      # Megvii YOLOX-s 0.1.1rc0 checkpoint, exported by scripts/export-detector.py yolox-s-960
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: ocsort        # roboflow trackers 2.6.1 OCSORTTracker, its defaults but the threshold
tracker_params:
  high_conf_det_threshold: 0.1
input_size: 960        # the exported model's fixed input
foot_point: auto-track # as h1-best.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
