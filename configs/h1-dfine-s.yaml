# H1b (spec 8, hypothesis 1): configs/h1-yolox-s.yaml with D-FINE-S in place of
# YOLOX-s: the Objects365 + COCO release checkpoint (Apache-2.0), exported to a
# 640 x 640 ONNX by its official exporter (scripts/export-detector.py dfine-s).
detector: dfine-s      # D-FINE-S obj2coco; class person, score > 0.1, no NMS (a DETR)
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: bytetrack     # roboflow trackers 2.6.1 ByteTrackTracker, its defaults
input_size: 640        # the exported model's input
foot_point: auto-track # as h1-yolox-s.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
