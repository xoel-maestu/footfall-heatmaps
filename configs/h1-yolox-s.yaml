# H1, first candidate (spec 8, hypothesis 1): the perception pipeline with the
# official YOLOX-s COCO model (Apache-2.0) in place of the Ultralytics reference
# recipe's detector, and the accepted foot point of h4-auto-track.yaml.
detector: yolox-s      # Megvii YOLOX-s, release 0.1.1rc0 ONNX; class person, score > 0.1, NMS 0.45 (the official demo's)
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: bytetrack     # roboflow trackers 2.6.1 ByteTrackTracker, its defaults
input_size: 640        # the release model's fixed input
foot_point: auto-track # bottom-centre, or the box top at the track's height when the box is clearly shorter than its track
track_height_percentile: 0.9  # a track's height: this quantile of its implied heights so far (causal)
hidden_ratio: 0.88            # a box below this share of its track's height has hidden legs
track_height_min_m: 1.0       # a track's height is clipped to a person's range
track_height_max_m: 2.0
stride: 1              # every frame
