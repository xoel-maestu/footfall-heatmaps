# gitleaks in CI (.github/workflows/verify.yml): its default rules, plus one
# escape: a fake fixture whose line ends with the `secret-scan: allow` marker
# as a trailing comment. The finding must be one line (`^`, `$` and no
# newline between them), so a multi-line private key block is never allowed.
[extend]
useDefault = true

[[allowlists]]
description = "fake fixtures marked secret-scan: allow"
regexTarget = "line"
regexes = ['''^[^\n]*(#|//|<!--)[ \t]*secret-scan: allow[ \t]*(-->)?[ \t\r]*$''']
