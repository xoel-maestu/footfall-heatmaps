# H3b (hypothesis 3): configs/h1-best.yaml with association on the
# floor plane, after UCMCTrack, in place of ByteTrack. Same detections (the
# detection cache replays them).
#
# Each box's bottom centre goes through the camera's floor homography; tracks
# move on the floor at constant velocity and boxes are matched by Mahalanobis
# distance in metres, so two people who overlap in the image but stand apart
# on the floor are not confused, and a person far from the camera moves as
# fast as a near one.
detector: yolox-s      # Megvii YOLOX-s 0.1.1rc0 checkpoint, exported by scripts/export-detector.py yolox-s-960
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: ucmc          # perception/infrastructure/ucmc_tracker.py, UCMCTrack's published defaults
input_size: 960        # the exported model's fixed input
foot_point: auto-track # as h1-best.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
