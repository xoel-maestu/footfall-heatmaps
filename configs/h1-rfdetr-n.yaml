# H1c (spec 8, hypothesis 1): configs/h1-yolox-s.yaml with RF-DETR Nano in place
# of YOLOX-s: Roboflow's COCO Nano checkpoint (Apache-2.0, rfdetr 1.11.2),
# exported to a 384 x 384 ONNX by the rfdetr package (scripts/export-detector.py rfdetr-n).
detector: rfdetr-n     # RF-DETR Nano COCO; class person, score > 0.1, no NMS (a DETR)
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: bytetrack     # roboflow trackers 2.6.1 ByteTrackTracker, its defaults
input_size: 384        # the Nano model's input
foot_point: auto-track # as h1-yolox-s.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
