# Improvements plan, phase 5: every calibrated camera of NVIDIA MTMC scene 071
# as one site, replayed from its video files (file-paced, no frame dropped).
#
#   uv run footfall calibrate --site configs/site-071.yaml
#   uv run footfall run --site configs/site-071.yaml --db data/site-071.db
#   uv run footfall serve --site configs/site-071.yaml --db data/site-071.db
#
# Relative sources and the weights file are under the data dir
# (FOOTFALL_DATA_DIR, default ~/datasets/footfall-heatmaps).
site: "071"
recipe: configs/e2a-record.yaml
stride: 10            # phase 3: 8 cameras keep up with 30 fps sources at stride 10
extent_m: [-17.8, -20.9, 18.3, 22.1]  # the scene's floor; snaps to 2 m blocks: 76 x 92 cells
cell_m: 0.5
retention_days: 90
start_utc: 2026-11-06T09:00:00Z      # video files: the wall time of their first frame
fusion:               # W1 (phase 4): visibility, power 2, on 2 m zones
  weighting: visibility
  power: 2
  zone_m: 2.0
  weights: sites/071/weights.npz      # frozen by footfall calibrate
calibration:
  minutes: 15         # the whole 13.3-min videos
cameras:
  - id: "635"
    source: nvidia/MTMC_Tracking_2024/test/scene_071/camera_0635/video.mp4
    calibration: nvidia-mtmc/071/635
