# The RF-DETR exporter's own environment (scripts/export-detector.py rfdetr-n).
# Separate from the repo's export group: rfdetr pins pyDeprecate < 0.10, which
# would downgrade the run path's trackers dependency. Never imported by the
# package. Install and run through scripts/export-detector.py.
[project]
name = "rfdetr-export"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rfdetr==1.11.2",  # Apache-2.0; its ONNX exporter and the Nano checkpoint's loader
    "torch>=2.14",
    "torchvision>=0.29",
    "onnx>=1.19",
    "onnxsim>=0.4.36",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
