# H6b (hypothesis 6): configs/h1-best.yaml with ByteTrack's high
# threshold and track activation threshold both 0.5: more boxes in the first
# stage, and more boxes start tracks. Same cached detections.
detector: yolox-s      # Megvii YOLOX-s 0.1.1rc0 checkpoint, exported by scripts/export-detector.py yolox-s-960
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: bytetrack     # roboflow trackers 2.6.1 ByteTrackTracker, its defaults but tracker_params
tracker_params:
  high_conf_det_threshold: 0.5
  track_activation_threshold: 0.5
input_size: 960        # the exported model's fixed input
foot_point: auto-track # as h1-yolox-s.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
