# H2a, second size (spec 8, hypothesis 2): configs/h1-yolox-s.yaml with the same YOLOX-s COCO
# checkpoint (Apache-2.0) exported at a 1280 x 1280 input (960 was accepted), for smaller and more
# distant people (under-detection was h1's main remaining error).
detector: yolox-s      # Megvii YOLOX-s 0.1.1rc0 checkpoint, exported by scripts/export-detector.py yolox-s-1280
engine: onnx-cuda      # ONNX Runtime, CUDA execution provider (CPU fallback is logged)
tracker: bytetrack     # roboflow trackers 2.6.1 ByteTrackTracker, its defaults
input_size: 1280        # the exported model's fixed input
foot_point: auto-track # as h1-yolox-s.yaml
track_height_percentile: 0.9
hidden_ratio: 0.88
track_height_min_m: 1.0
track_height_max_m: 2.0
stride: 1
